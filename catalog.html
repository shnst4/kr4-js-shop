<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог — Drink drank drunk</title>
    <link rel="stylesheet" href="css/style.css" />

    <script src="js/data.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/catalog.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">Напиточная</a>

      <nav aria-label="Основная навигация">
        <a href="catalog.html" aria-current="page">Каталог</a>
        <a href="cart.html">Корзина</a>
        <a href="order.html">Оформить заказ</a>
      </nav>
    </header>

    <main>
      <section class="catalog" aria-labelledby="catalog-title">
        <h1 id="catalog-title">Каталог напитков</h1>
        <p>Выбирай напиток под своё настроение!</p>

        <div class="catalog-search">
          <label for="product-search">Поиск напитков</label>
          <input
            type="search"
            id="product-search"
            placeholder="Например, Цикорий"
          />
        </div>

        <div class="catalog-filter">
          <label for="category-filter">Категория напитков</label>

          <select id="category-filter">
            <option value="all">Все напитки</option>
            <option value="coffee">Кофе</option>
            <option value="cocktails">Коктейли</option>
            <option value="cold">Холодные напитки</option>
            <option value="hot">Горячие напитки</option>
          </select>
        </div>

        <div class="catalog-filter">
          <label for="sort-order">Сортировка</label>

          <select id="sort-order">
            <option value="default">По умолчанию</option>
            <option value="asc">Сначала дешёвые</option>
            <option value="desc">Сначала дорогие</option>
          </select>
        </div>

        <button class="reset-button" id="reset-filters" type="button">
          Сбросить фильтры
        </button>

        <p class="catalog-count" aria-live="polite">
          Найдено напитков: <span id="products-count">0</span>
        </p>

        <div class="products-grid"></div>
      </section>
    </main>
  </body>
</html>
